name: CI

on:
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: PR a main solo puede venir de develop
        if: github.base_ref == 'main' && github.head_ref != 'develop'
        run: |
          echo "Los PR contra main solo se aceptan desde develop (este viene de '${{ github.head_ref }}')." >&2
          exit 1

      - name: Tests
        run: ./scripts/test_local.sh
